<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | SpendWise</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reset.css" />
  </head>

  <body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="reset-container fade-in">
        <div class="logo">Spend<span>Wise</span></div>
        <h1>Generate New Password</h1>
        <p class="subtitle">Secure your account with a strong password.</p>

        <form>
          <div class="input-group">
            <input id="password1" type="password" placeholder="Enter new password" required />
          </div>
          <div class="input-group">
            <input id="password2" type="password" placeholder="Confirm password" required />
          </div>
          <button id="passChange" type="submit" class="btn-primary">Reset Password</button>
        </form>
        
        <a href="../login/login.html" class="back-link">← Back to Login</a>
    </div>

    <script src="../axios.min.js"></script>
    <script src="forgot.js"></script>
  </body>
</html>
